<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Item Master</title>

<!--    bootstrap linking codes -->
    <link rel="stylesheet" href="../static/bootstrap-5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/main.css">
    <script src="../static/bootstrap-5.2/js/bootstrap.min.js"></script>

<!--    tailwind linking code-->
    <script src="../static/tailwind/browser@4.js"></script>

<!--    sweet alert code links-->
    <link rel="stylesheet" href="../static/sweetAlert/sweetalert2.min.css">
    <script src="../static/sweetAlert/sweetalert2.all.min.js"></script>


<!--    data table links-->
    <script src="../static/datatable/js/dataTables.min.js"></script>
    <script src="../static/datatable/js/dataTables.buttons.min.js"></script>
    <script src="../static/datatable/js/buttons.dataTables.min.js"></script>
    <script src="../static/datatable/js/jszip.min.js"></script>
    <script src="../static/datatable/js/pdfmake.min.js"></script>
    <script src="../static/datatable/js/vfs_fonts.js"></script>
    <link rel="stylesheet" href="../static/datatable/css/dataTables.dataTables.min.css">
    <link rel="stylesheet" href="../static/datatable/css/buttons.dataTables.min.css">


<!--   controller file linking code -->
    <script src="../static/controllerJS/itemMaster.js"></script>

<!--    service files link-->
    <script src="../static/services/itemCategoryService.js"></script>
    <script src="../static/services/itemMasterService.js"></script>
    <script src="../static/services/itemSizeService.js"></script>
    <script src="../static/services/itemStatusService.js"></script>

<!--    helping files link-->
    <script src="../static/commonJS/dropDownGenerator.js"></script>
    <script src="../static/validators/textValidator.js"></script>



</head>
<body class="container-fluid">
<h1 class="text-center bg-emerald-900 mt-2 p-4 rounded-2 text-white">Item Master</h1>


<!--form area start-->
<div class="p-2">
<div class="row">
    <div class="col-md-2">
        <label class="form-label" for="selectItemCategory">Item Category <i class="text-danger">*</i> </label>
        <select class="form-select" id="selectItemCategory" style="height: 60px" onchange="itemMaster.item_category_master_id=this.value; this.style.border='1px solid green'; console.log(this.value) "></select>
    </div>
    <div class="col-md-2">
        <label class="form-label" for="textItemName">Item Name <i class="text-danger">*</i> </label>
        <input type="text" id="textItemName" class="form-control fw-bold" style="height: 60px" placeholder="Enter Item Name" onkeyup="textValidator(this,'','itemMaster','item_master_name')">
    </div>
    <div class="col-md-2">
        <label class="form-label" for="textItemShortName">Item Short Name <i class="text-danger">*</i> </label>
        <input type="text" id="textItemShortName" class="form-control fw-bold" style="height: 60px" placeholder="Enter Item Short Name" onkeyup="textValidator(this,'','itemMaster','item_master_short_name')">
    </div>
    <div class="col-md-2">
        <label class="form-label" for="textCode">Item Code <i class="text-danger">*</i> </label>
        <input type="text" id="textCode" class="form-control fw-bold" style="height: 60px" placeholder="Enter Item Code" onkeyup="textValidator(this,'','itemMaster','item_master_code')">
    </div>


    <div class="col-md-2">
        <label class="form-label" for="selectItemSize">Item Size <i class="text-danger">*</i> </label>
        <select class="form-select" id="selectItemSize" style="height: 60px" onchange="itemMaster.item_size_id=this.value; this.style.border='1px solid green'; console.log(this.value) "></select>
    </div>


    <div class="col-md-2">
        <label class="form-label" for="textNoOfPages">No of Pages <i class="text-danger">*</i> </label>
        <input type="number" id="textNoOfPages" class="form-control fw-bold" style="height: 60px" placeholder="Enter No of pages" onkeyup="textValidator(this,'','itemMaster','item_master_no_of_pages')">
    </div>


</div>

<div class="row">
    <div class="col-md-2">
        <label class="form-label" for="textBooksInPack">Books In Pack </label>
        <input type="number" id="textBooksInPack" class="form-control fw-bold" style="height: 60px" placeholder="Books In Pack" onkeyup="textValidator(this,'','itemMaster','item_master_books_in_pack')">
    </div>
    <div class="col-md-2">
        <label class="form-label" for="textPacksInBox">Packs In Box</label>
        <input type="number" id="textPacksInBox" class="form-control fw-bold" style="height: 60px" placeholder="Enter Packs In Box" onkeyup="textValidator(this,'','itemMaster','item_master_books_in_box')">
    </div>
    <div class="col-md-2">
        <label class="form-label" for="textBarCode">Barcode <i class="text-danger">*</i> </label>
        <input type="number" id="textBarCode" class="form-control fw-bold" style="height: 60px" placeholder="Enter Barcode" onkeyup="textValidator(this,'','itemMaster','item_master_barcode')">
    </div>
    <div class="col-md-2">
        <label class="form-label" for="textPrice">Price <i class="text-danger">*</i> </label>
        <input type="number" id="textPrice" class="form-control fw-bold" style="height: 60px" placeholder="Enter Price" onkeyup="textValidator(this,'','itemMaster','item_master_price')">
    </div>
    <div class="col-md-2">
        <label class="form-label" for="textCost">Cost </label>
        <input type="number" id="textCost" class="form-control fw-bold" style="height: 60px" placeholder="Enter Cost" onkeyup="textValidator(this,'','itemMaster','item_master_cost')">
    </div>
    <div class="col-md-2">
        <label class="form-label" for="selectItemStatus">Item Status <i class="text-danger">*</i> </label>
        <select class="form-select" id="selectItemStatus" style="height: 60px" onchange="itemMaster.item_master_status_id=this.value; this.style.border='1px solid green'; console.log(this.value) "></select>
    </div>
</div>


<div class="row">
    <div class="col-md-6">
        <label class="form-label" for="textDescription">Description </label>
        <input type="text" id="textDescription" class="form-control fw-bold" style="height: 80px" placeholder="Enter Cost" onkeyup="textValidator(this,'','itemMaster','item_master_description')">
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-2"></div>
    <div class="col-md-2">
        <button type="button" id="btnReset" onclick="window.location.reload()" class="btn text-white" style="background-color: #065f46">Reset</button>
    </div>
    <div class="col-md-2"></div>
    <div class="col-md-2">
        <button type="button" id="btnUpdate" onclick="updateItemMaster()" class="btn text-white" style="background-color: #065f46">Update</button>
    </div>
    <div class="col-md-2"></div>
    <div class="col-md-2">
        <button type="button" id="btnSave" onclick="saveItemMaster()" class="btn text-white" style="background-color: #065f46">Save</button>
    </div>
</div>


</div>
<!--form area end-->

<!--table area start-->
<table class="table table-bordered table-responsive display" id="tableItemMaster" >
    <thead>
    <tr>
        <th>#</th>
        <th>Item name</th>
        <th>Item Short name</th>
        <th>Item Price</th>
        <th>Item Cost</th>
        <th>Barcode</th>
        <th class="text-center">Actions</th>
    </tr>
    </thead>
    <tbody id="itemTableBody">

    </tbody>
</table>
<!--table area end-->



</body>
</html>
