<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Privilege Master</title>

<!--    bootstrap linking codes -->
    <link rel="stylesheet" href="../static/bootstrap-5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/main.css">
    <script src="../static/bootstrap-5.2/js/bootstrap.min.js"></script>

<!--    tailwind linking code-->
    <script src="../static/tailwind/browser@4.js"></script>

<!--    sweet alert code links-->
    <link rel="stylesheet" href="../static/sweetAlert/sweetalert2.min.css">
    <script src="../static/sweetAlert/sweetalert2.all.min.js"></script>


<!--    data table links-->
    <script src="../static/datatable/js/dataTables.min.js"></script>
    <script src="../static/datatable/js/dataTables.buttons.min.js"></script>
    <script src="../static/datatable/js/buttons.dataTables.min.js"></script>
    <script src="../static/datatable/js/jszip.min.js"></script>
    <script src="../static/datatable/js/pdfmake.min.js"></script>
    <script src="../static/datatable/js/vfs_fonts.js"></script>
    <link rel="stylesheet" href="../static/datatable/css/dataTables.dataTables.min.css">
    <link rel="stylesheet" href="../static/datatable/css/buttons.dataTables.min.css">


<!--   controller file linking code -->
    <script src="../static/controllerJS/privilegeMaster.js"></script>

<!--    service files link-->
    <script src="../static/services/employeeMasterService.js"></script>
    <script src="../static/services/userMasterService.js"></script>
    <script src="../static/services/designationService.js"></script>
    <script src="../static/services/roleService.js"></script>

<!--    helping files link-->
    <script src="../static/commonJS/dropDownGenerator.js"></script>
    <script src="../static/validators/textValidator.js"></script>
    <script src="../static/validators/dropdownValidator.js"></script>



</head>
<body class="container-fluid">
<h1 class="text-center bg-emerald-900 mt-2 p-4 rounded-2 text-white">Privilege Master</h1>


<!--form area start-->
<div class="p-2">
<div class="row">
    <div class="col-md-2">
        <label class="form-label" for="comboSelect">Select <i class="text-danger">*</i> </label>
        <select class="form-select" id="comboSelect" style="height: 60px" onchange="dropdownValidator(this,'privilegeMaster','sel')" required>
            <option value="" selected disabled>Select An Option</option>
            <option value="1">Active</option>
            <option value="0">In-active</option>
        </select>
        <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please Select an Option</div>
    </div>
    <div class="col-md-2">
        <label class="form-label" for="comboCreate">Create <i class="text-danger">*</i> </label>
        <select class="form-select" id="comboCreate" style="height: 60px" onchange="dropdownValidator(this,'privilegeMaster','inst')" required>
            <option value="" selected disabled>Select An Option</option>
            <option value="1">Active</option>
            <option value="0">In-active</option>
        </select>
        <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please Select an Option</div>
    </div>
    <div class="col-md-2">
        <label class="form-label" for="comboUpdate">update <i class="text-danger">*</i> </label>
        <select class="form-select" id="comboUpdate" style="height: 60px" onchange="dropdownValidator(this,'privilegeMaster','upd')" required>
            <option value="" selected disabled>Select An Option</option>
            <option value="1">Active</option>
            <option value="0">In-active</option>
        </select>
        <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please Select an Option</div>
    </div>
    <div class="col-md-2">
        <label class="form-label" for="comboDelete">Delete <i class="text-danger">*</i> </label>
        <select class="form-select" id="comboDelete" style="height: 60px" onchange="dropdownValidator(this,'privilegeMaster','del')" required>
            <option value="" selected disabled>Select An Option</option>
            <option value="1">Active</option>
            <option value="0">In-active</option>
        </select>
        <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please Select an Option</div>
    </div>


    <div class="col-md-2">
        <label class="form-label" for="selectRole">Role <i class="text-danger">*</i> </label>
        <select class="form-select" id="selectRole" style="height: 60px" onchange="dropdownValidator(this,'privilegeMaster','role_id')"></select>
        <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please Select an Option</div>
    </div>


    <div class="col-md-2">
        <label class="form-label" for="selectModule">Module <i class="text-danger">*</i> </label>
        <select class="form-select" id="selectModule" style="height: 60px" onchange="dropdownValidator(this,'privilegeMaster','module_id')"></select>
        <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please Select an Option</div>

    </div>


</div>


<div class="row mt-4">
    <div class="col-md-2"></div>
    <div class="col-md-2">
        <button type="button" id="btnReset" onclick="window.location.reload()" class="rounded bg-emerald-800 px-3 py-2 text-neutral-50 hover:bg-black">Reset</button>
    </div>
    <div class="col-md-2"></div>
    <div class="col-md-2">
        <button type="button" id="btnUpdate" onclick="updateUserMaster()" class="rounded bg-emerald-800 px-3 py-2 text-neutral-50 hover:bg-black">Update</button>
    </div>
    <div class="col-md-2"></div>
    <div class="col-md-2">
        <button type="button" id="btnSave" onclick="saveUserMaster()" class="rounded bg-emerald-800 px-3 py-2 text-neutral-50 hover:bg-black">Save</button>
    </div>
</div>


</div>
<!--form area end-->

<!--table area start-->
<table class="table table-bordered table-responsive display" id="tablePrivilegeMaster" >
    <thead>
    <tr>
        <th>#</th>
        <th>Select</th>
        <th>Create</th>
        <th>Update</th>
        <th>Delet</th>
        <th class="text-center">Actions</th>
    </tr>
    </thead>
    <tbody id="privilegeMasterTableBody">

    </tbody>
</table>
<!--table area end-->



</body>
</html>
