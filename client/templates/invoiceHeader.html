<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoice Master</title>

  <!--    bootstrap linking codes -->
  <link rel="stylesheet" href="../static/bootstrap-5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/main.css">
  <script src="../static/bootstrap-5.2/js/bootstrap.min.js"></script>

  <!--    tailwind linking code-->
  <script src="../static/tailwind/browser@4.js"></script>

  <!--    sweet alert code links-->
  <link rel="stylesheet" href="../static/sweetAlert/sweetalert2.min.css">
  <script src="../static/sweetAlert/sweetalert2.all.min.js"></script>


  <!--    data table links-->
  <script src="../static/datatable/js/dataTables.min.js"></script>
  <script src="../static/datatable/js/dataTables.buttons.min.js"></script>
  <script src="../static/datatable/js/buttons.dataTables.min.js"></script>
  <script src="../static/datatable/js/jszip.min.js"></script>
  <script src="../static/datatable/js/pdfmake.min.js"></script>
  <script src="../static/datatable/js/vfs_fonts.js"></script>
  <link rel="stylesheet" href="../static/datatable/css/dataTables.dataTables.min.css">
  <link rel="stylesheet" href="../static/datatable/css/buttons.dataTables.min.css">


  <!--   controller file linking code -->
  <script src="../static/controllerJS/invoiceHeader.js"></script>

  <!--    service files link-->
  <script src="../static/services/itemMasterService.js"></script>
  <script src="../static/services/invoiceHeaderService.js"></script>

  <!--    helping files link-->
  <script src="../static/commonJS/dropDownGenerator.js"></script>
  <script src="../static/validators/textValidator.js"></script>
  <script src="../static/validators/dropdownValidator.js"></script>


</head>
<body class="container-fluid">
<h1 class="text-center bg-emerald-900 mt-2 p-4 rounded-2 text-white">Invoice Master</h1>

<div class="p-2">
  <div class="row">

    <div class="col-md-3">
      <label class="form-label" for="selectBranchName">Branch Name<i class="text-danger">*</i> </label>
      <select class="form-select" id="selectBranchName" style="height: 60px" onchange="dropdownValidator(this,'invoiceHeaderMaster','location_master_id')" required></select>
      <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please Select an Option</div>
    </div>


    <div class="col-md-3">
      <label class="form-label" for="textDiscountPercentage">Discount Percentage % </label>
      <input type="text" id="textDiscountPercentage" class="form-control fw-bold" style="height: 60px" placeholder="Enter Discount Percentage" onkeyup="textValidator(this,'','invoiceHeaderMaster','invoice_header_discount_percentage')">
      <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please enter a valid Item Percentage</div>
    </div>
    <div class="col-md-3"></div>


    <div class="col-md-3">
        <div>
          <label class="form-label" for="textDate">Date</label>
          <input type="date" id="textDate" class="form-control fw-bold" style="height: 60px" onchange="textValidator(this,'','invoiceHeaderMaster','invoice_header_created_date')">
          <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please enter a valid Date</div>
        </div>


      <div>
        <label class="form-label" for="textPoNumber">Customer PO No</label>
        <input type="text" id="textPoNumber" class="form-control fw-bold" style="height: 60px" onchange="textValidator(this,'','invoiceHeaderMaster','invoice_header_po_number')">
        <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please enter a valid PO No</div>
      </div>


      <div>
        <label class="form-label" for="textDispatchNumber">Dispatch No</label>
        <input type="text" id="textDispatchNumber" class="form-control fw-bold" style="height: 60px" onchange="textValidator(this,'','invoiceHeaderMaster','invoice_header_dispatch_number')">
        <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please enter a valid Dispatch No</div>
      </div>

      <div>
        <label class="form-label" for="selectStatus">Invoice Status<i class="text-danger">*</i> </label>
        <select class="form-select" id="selectStatus" style="height: 60px" onchange="dropdownValidator(this,'invoiceHeaderMaster','invoice_status_invoice_status_id')" required></select>
        <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please Select an Option</div>
      </div>

    </div>


  </div>
</div>


</body>
</html>
