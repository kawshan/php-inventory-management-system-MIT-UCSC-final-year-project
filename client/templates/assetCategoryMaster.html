<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assert Category Master</title>

<!--    bootstrap linking codes -->
    <link rel="stylesheet" href="../static/bootstrap-5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/main.css">
    <script src="../static/bootstrap-5.2/js/bootstrap.min.js"></script>

<!--    tailwind linking code-->
    <script src="../static/tailwind/browser@4.js"></script>

<!--    sweet alert code links-->
    <link rel="stylesheet" href="../static/sweetAlert/sweetalert2.min.css">
    <script src="../static/sweetAlert/sweetalert2.all.min.js"></script>


<!--    data table links-->
    <script src="../static/datatable/js/dataTables.min.js"></script>
    <script src="../static/datatable/js/dataTables.buttons.min.js"></script>
    <script src="../static/datatable/js/buttons.dataTables.min.js"></script>
    <script src="../static/datatable/js/jszip.min.js"></script>
    <script src="../static/datatable/js/pdfmake.min.js"></script>
    <script src="../static/datatable/js/vfs_fonts.js"></script>
    <link rel="stylesheet" href="../static/datatable/css/dataTables.dataTables.min.css">
    <link rel="stylesheet" href="../static/datatable/css/buttons.dataTables.min.css">


<!--   controller file linking code -->
    <script src="../static/controllerJS/assetCategoryMaster.js"></script>

<!--    service files link-->
    <script src="../static/services/itemCategoryService.js"></script>
    <script src="../static/services/itemMasterService.js"></script>
    <script src="../static/services/itemSizeService.js"></script>
    <script src="../static/services/itemStatusService.js"></script>

<!--    helping files link-->
    <script src="../static/commonJS/dropDownGenerator.js"></script>
    <script src="../static/validators/textValidator.js"></script>
    <script src="../static/validators/dropdownValidator.js"></script>



</head>
<body class="container-fluid">
<h1 class="text-center bg-emerald-900 mt-2 p-4 rounded-2 text-white">Asset Category Master</h1>


<!--form area start-->
<div class="p-2">
<div class="row">
    <div class="col-md-2">
        <label class="form-label" for="textAssetName">Asset Name <i class="text-danger">*</i> </label>
        <input type="text" id="textAssetName" class="form-control fw-bold" style="height: 60px" placeholder="Enter Asset Name" onkeyup="textValidator(this,'','assetCategoryMaster','name')" required>
        <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please enter a valid Asset Category Name</div>
    </div>
    <div class="col-md-2">
        <label class="form-label" for="selectStatus">Status<i class="text-danger">*</i> </label>
        <select class="form-select" id="selectStatus" style="height: 60px" onchange="dropdownValidator(this,'assetCategoryMaster','status')" required>
            <option value="" selected disabled>Select An Option</option>
            <option value="1">Active</option>
            <option value="0">In-active</option>
        </select>
        <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please Select an Option</div>
    </div>
    <div class="col-md-6">
        <label class="form-label" for="textDescription">Description</label>
        <input type="text" id="textDescription" class="form-control fw-bold" style="height: 60px" placeholder="Enter Description" onkeyup="textValidator(this,'','assetCategoryMaster','description')">
        <div class="valid-feedback">Looks good!</div><div class="invalid-feedback">Please enter a valid Asset Category Name</div>

    </div>

</div>


    <div class="row mt-4">
        <div class="col-md-2"></div>
        <div class="col-md-2">
            <button type="button" id="btnReset" onclick="window.location.reload()" class="btn text-white" style="background-color: #065f46">Reset</button>
        </div>
        <div class="col-md-2"></div>
        <div class="col-md-2">
            <button type="button" id="btnUpdate" onclick="updateItemMaster()" class="btn text-white" style="background-color: #065f46">Update</button>
        </div>
        <div class="col-md-2"></div>
        <div class="col-md-2">
            <button type="button" id="btnSave" onclick="saveItemMaster()" class="btn text-white" style="background-color: #065f46">Save</button>
        </div>
    </div>


</div>
<!--form area end-->

<!--table area start-->
<table class="table table-bordered table-responsive display" id="tableItemMaster" >
    <thead>
    <tr>
        <th>#</th>
        <th>Item name</th>
        <th>Item Short name</th>
        <th>Item Price</th>
        <th>Item Cost</th>
        <th>Barcode</th>
        <th class="text-center">Actions</th>
    </tr>
    </thead>
    <tbody id="itemTableBody">

    </tbody>
</table>
<!--table area end-->



</body>
</html>
